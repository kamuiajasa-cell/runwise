name: Build RunSense APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: runsense-android-build-v2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RUNSENSE_KEYSTORE_BASE64 != '' && secrets.RUNSENSE_STORE_PASSWORD != '' && secrets.RUNSENSE_KEY_ALIAS != '' && secrets.RUNSENSE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ensure Huawei transport sources (vendor/RunNowNative)
        shell: bash
        run: |
          if [ ! -f vendor/RunNowNative/huawei/src/main/AndroidManifest.xml ]; then
            echo "Submodule kosong (umum terjadi saat upload ZIP lewat web GitHub); clone manual."
            rm -rf vendor/RunNowNative
            git clone --depth 1 https://github.com/kamuiajasa-cell/RunNowNative.git vendor/RunNowNative
          fi
          ls vendor/RunNowNative/huawei/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run original RunSense domain golden tests
        run: gradle :domain:test --no-daemon
      - name: Run native data and watch-ingest tests
        run: gradle :data:test --tests com.runnow.data.JsonTest --tests com.runnow.data.WatchImportCodecTest --no-daemon
      - name: Run app unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Run Android lint (report only)
        continue-on-error: true
        run: gradle :app:lintDebug --no-daemon
      - name: Build native debug APK
        run: gradle :app:assembleDebug --no-daemon -PVERSION_CODE=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: RunSense-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Report merged debug manifest permissions
        shell: bash
        run: |
          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/merged_manifest(s)?/debug/' | head -n 1)"
          if [ -z "$MANIFEST" ]; then
            echo "Merged debug manifest not found; inspect AGP output layout."
            find app/build/intermediates -type f -name AndroidManifest.xml | head -n 20
          else
            echo "Merged manifest: $MANIFEST"
            grep -o 'android:name="android.permission.[^"]*"' "$MANIFEST" | sort -u
          fi
      - name: Restore permanent release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RUNSENSE_KEYSTORE_BASE64: ${{ secrets.RUNSENSE_KEYSTORE_BASE64 }}
        run: |
          echo "$RUNSENSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/runsense-release.jks"
          chmod 600 "$RUNNER_TEMP/runsense-release.jks"
      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RUNSENSE_KEYSTORE_FILE: ${{ runner.temp }}/runsense-release.jks
          RUNSENSE_STORE_PASSWORD: ${{ secrets.RUNSENSE_STORE_PASSWORD }}
          RUNSENSE_KEY_ALIAS: ${{ secrets.RUNSENSE_KEY_ALIAS }}
          RUNSENSE_KEY_PASSWORD: ${{ secrets.RUNSENSE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=2.0.${{ github.run_number }}
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RunSense-native-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Explain missing release signing secrets
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: echo "Release APK skipped. Configure the four RUNSENSE_* GitHub Actions secrets to enable permanent signing."
