name: Import RunWise fixed archive

on:
  push:
    branches:
      - main
    paths:
      - "runwise-fixed.zip"
      - ".github/workflows/import-runwise-fixed.yml"

permissions:
  contents: write

jobs:
  import-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract files into their repository paths
        run: |
          test -f runwise-fixed.zip
          unzip -o runwise-fixed.zip -d .
          git status --short

      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The connected GitHub App cannot push workflow-file changes; update that file separately via the repository API.
          git reset -q -- .github/workflows/android.yml || true
          if git diff --cached --quiet; then
            echo "Archive contents already match the repository."
            exit 0
          fi
          git commit -m "Import runwise-fixed archive into project structure [skip ci]"
          git push origin HEAD:main
